<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity WebGL</title>
    <style>
      html,body,#unity-container{margin:0;height:100%;overflow:hidden;background:#0b0f1d;}
      #unity-container{position:relative;width:100%;height:100%}
      /* Center an inner 16:9 area; canvas will never exceed it */
      #unity-frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
      #unity-canvas{display:block;background:transparent}
    </style>
    </head>
    <body>
      <div id="unity-container">
        <div id="unity-frame">
          <canvas id="unity-canvas" tabindex="0"></canvas>
        </div>
      </div>
    
      <script src="Build/{{{ LOADER_FILENAME }}}"></script>
      <script>
        const canvas = document.getElementById("unity-canvas");
        const frame  = document.getElementById("unity-frame");
        function resizeCanvas(){
          const W = frame.clientWidth, H = frame.clientHeight, AR = 16/9;
          let w = W, h = (W/AR)|0;
          if (h > H) { h = H; w = (H*AR)|0; }      // letterbox/pillarbox
          canvas.style.width  = w + "px";
          canvas.style.height = h + "px";
        }
        new ResizeObserver(resizeCanvas).observe(frame);
        window.addEventListener("orientationchange", resizeCanvas);
        resizeCanvas();
    
        createUnityInstance(canvas, {
          dataUrl: "Build/{{{ DATA_FILENAME }}}",
          frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
          codeUrl: "Build/{{{ CODE_FILENAME }}}",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "{{{ COMPANY_NAME }}}",
          productName: "{{{ PRODUCT_NAME }}}",
          productVersion: "{{{ PRODUCT_VERSION }}}",
          matchWebGLToCanvasSize: true,
          devicePixelRatio: 1
        }).then(()=>{}).catch(()=>{});
      </script>
    </body></html>
